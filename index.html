<!DOCTYPE html>
<html lang="en">
<head>
 
    <title>For You, My Love</title>
    

    <style>
         .typing-effect{
            color: rgba(188, 109, 220, 0.915);
            

         }
                body {
     
            background-image: url('devanshi.jpg');
            background-size: cover;  
            background-position: center; 
            background-attachment: fixed; 
            height: 100vh;  
            margin: 0; 
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            justify-content: center;
            align-items: top;
            background-color: #ac80af;
            align-items: top;
            color:  #da00ea;
            padding: 50px 0;
        }
      
        h1 {
            font-size: 2.5em;
            margin: 0;
        }
        .buttons {
            margin-top: 30px;
        }
        button {
            font-size: 1.2em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .yes-btn {
            background-color: #28a745;
            color: white;
        }
        .no-btn {
            background-color: #dc3545;
            color: white;
        }
       

        button {
    transition: transform 0.3s ease, background-color 0.3s ease;
}

button:hover {
    transform: scale(1.1);
    background-color: #ac80af;

}
.typing-effect {
    display: inline-block;
    font-family: 'Courier New', monospace;
    font-size: 2.5em;
    justify-content: center;
    align-items: center;
    width: 0;
    overflow: hidden;
    border-right: 3px solid #c895e8;
    white-space: nowrap;
    animation: typing 3s steps(30) 1s forwards, blink 0.75s step-end infinite;
}

@keyframes typing {
    from {
        width: 0;
    }
    to {
        width: 100%;
    }
}

@keyframes blink {
    50% {
        border-color: transparent;
    }
}
.scroll-in {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
}

.scroll-in.visible {
    opacity: 1;
    transform: translateY(0);
}
.popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #28a745;
    color: rgb(228, 130, 241);
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
    opacity: 0;
    animation: popupAnimation 1s forwards;
}

@keyframes popupAnimation {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}
   
    .button{
     
            background-color: #ec4fe9;
            color: rgb(244, 174, 226);



    }
   

    </style>
    <script>
     
        function checkScroll() {
            const elements = document.querySelectorAll('.scroll-in');
            elements.forEach(element => {
                if (isElementInViewport(element)) {
                    element.classList.add('visible');
                }
            });
        }
    
        
        function isElementInViewport(el) {
            const rect = el.getBoundingClientRect();
            return rect.top <= window.innerHeight && rect.bottom >= 0;
        }
    
        
        window.addEventListener('scroll', checkScroll);
        checkScroll();
       
     document.querySelector('.final-btn').addEventListener('click', function() {
        const popup = document.getElementById('popupMessage');
        popup.style.display = 'block';
    });
</script>

    
</head>
<body>

    </div>
    
    <div class="message scroll-in">
        <p>From the moment we met...</p>
    </div>
    
    <h1><span class="typing-effect" id="love">Will You Be Mine devasnhi?</span></h1>

<header>
    <strong><h1>ARE YOU IN LOVE WITH ME?<h1></h1></strong>
    <p>Click Yes if you feel the same, or No if you'd rather not.</p>
</header>

<div class="buttons">
    <button class="yes-btn" onclick="window.location.href='devanshi.html'">Yes</button>
    <button class="no-btn" onclick="window.location.href='nick.html'">No</button>
    <button class="button" onclick="window.location.href='demon.html'">Memories</button>
</div>

</body>
</html>
